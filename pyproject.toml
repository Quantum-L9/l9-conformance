[project]
name = "l9-conformance"
version = "0.1.0"
description = "Executable conformance owner: fixture profiles, conformance runner, conformance receipts."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["l9_conformance", "scripts", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
