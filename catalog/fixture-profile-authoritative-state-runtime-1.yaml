obligations:
- id: O-AS-RUNTIME-STATE-READ-001
  law_ref: STATE-READ-001
  statement: Read observations do not create durable mutation receipts.
  state_law_class: persistence
  verification_class: fixture_replay
- id: O-AS-RUNTIME-STATE-BUDGET-002
  law_ref: STATE-BUDGET-002
  statement: Provider retries, transaction retries, commit attempts, and reconciliation never outlive
    ExecutionBudget.
  state_law_class: deadline
  verification_class: external_runtime_evidence
- id: O-AS-RUNTIME-STATE-RETENTION-001
  law_ref: STATE-RETENTION-001
  statement: TTL cleanup is never semantic authority for leases, operations, tombstones, or erasure.
  state_law_class: retention
  verification_class: fixture_replay
- id: O-AS-RUNTIME-STATE-EVENT-OPT-001
  law_ref: STATE-EVENT-OPT-001
  statement: Push/change-stream execution is deferred until it proves leverage; correctness uses durable
    journal polling.
  state_law_class: leverage
  verification_class: fixture_replay
- id: O-AS-RUNTIME-STATE-ATOMIC-001
  law_ref: STATE-ATOMIC-001
  statement: State mutation commits projection, immutable revision, event, and receipt atomically.
  state_law_class: atomicity
  verification_class: fixture_replay
- id: O-AS-RUNTIME-STATE-JOURNAL-001
  law_ref: STATE-JOURNAL-001
  statement: The canonical journal is the sole authoritative mutation-event/outbox source.
  state_law_class: events
  verification_class: fixture_replay
- id: O-AS-RUNTIME-STATE-RECOVERY-001
  law_ref: STATE-RECOVERY-001
  statement: Ambiguous mutation completion is reconciled by operation receipt before retry.
  state_law_class: recovery
  verification_class: fixture_replay
- id: O-AS-RUNTIME-STATE-RETENTION-002
  law_ref: STATE-RETENTION-002
  statement: State executes hard-erasure mechanics only from externally authorized retention decisions
    and never invents retention policy.
  state_law_class: authority
  verification_class: fixture_replay
