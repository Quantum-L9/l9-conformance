obligations:
- id: O-AS-CAPABILITY-STATE-OUTCOME-002
  law_ref: STATE-OUTCOME-002
  statement: Committed, conflict, and refused are terminal receipt states; expected mutation outcomes
    are data.
  state_law_class: outcome
  verification_class: fixture_replay
- id: O-AS-CAPABILITY-STATE-PROBLEM-001
  law_ref: STATE-PROBLEM-001
  statement: StateProblem is never persisted as an authoritative operation receipt.
  state_law_class: outcome
  verification_class: fixture_replay
- id: O-AS-CAPABILITY-STATE-RETRY-001
  law_ref: STATE-RETRY-001
  statement: retry_class describes retry safety, not workflow recovery.
  state_law_class: recovery
  verification_class: fixture_replay
- id: O-AS-CAPABILITY-STATE-RETRY-002
  law_ref: STATE-RETRY-002
  statement: Recovery after a terminal receipt is reason-code guidance and uses a new operation identity.
  state_law_class: recovery
  verification_class: fixture_replay
- id: O-AS-CAPABILITY-STATE-CLAIM-001
  law_ref: STATE-CLAIM-001
  statement: Claims coordinate writers but do not grant business authority.
  state_law_class: authority
  verification_class: fixture_replay
- id: O-AS-CAPABILITY-STATE-FENCE-001
  law_ref: STATE-FENCE-001
  statement: Fence lineage is monotonic and stale claims never authorize mutation.
  state_law_class: concurrency
  verification_class: fixture_replay
- id: O-AS-CAPABILITY-STATE-RESTORE-001
  law_ref: STATE-RESTORE-001
  statement: Restore requires a retained prior revision of the same tombstoned object and always creates
    a new active revision.
  state_law_class: lifecycle
  verification_class: fixture_replay
- id: O-AS-CAPABILITY-STATE-CURSOR-001
  law_ref: STATE-CURSOR-001
  statement: Public cursors are State-issued and provider-independent.
  state_law_class: recovery
  verification_class: fixture_replay
- id: O-AS-CAPABILITY-STATE-EVENT-001
  law_ref: STATE-EVENT-001
  statement: Journal order is total within scope only.
  state_law_class: ordering
  verification_class: fixture_replay
