authoritative_state_classification:
  owner: l9-conformance
  authority: >-
    profile_resolution is owned by l9-conformance (Quantum-L9/.github semantics/conformance_model.yaml);
    State product-topology records the operator decision of 2026-11-12, "one fixture profile per
    node class; CONFORMANCE owns their content".
  rule: >-
    Each State law (law_index of the product's fixture IR) is assigned to exactly one conformance
    class by the subject its own statement constrains. core: the revisioned state model itself
    (revision, object identity, idempotency, lifecycle) independent of any action, transport or
    provider. capability: observable semantics of the declared state.* actions (receipts, outcomes,
    problems, retry guidance, claims, fences, restore, cursors, event order). runtime: persistence,
    provider, retry/budget execution, TTL and restart behaviour. adapter: the Gate SDK adapter
    binding (Gate mediation, Gate-owned budget). A law whose statement does not decide one class
    is recorded as unresolved in every profile and carried by none.
  witness: obligations[].law_ref in each authoritative-state profile
does_not_own:
  - global_constitutional_law
  - memory_release_admission
