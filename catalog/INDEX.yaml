authoritative_state_classification:
  owner: l9-conformance
  authority: >-
    profile_resolution is owned by l9-conformance (Quantum-L9/.github semantics/conformance_model.yaml);
    State product-topology records the operator decision of 2026-11-12, "one fixture profile per
    node class; CONFORMANCE owns their content".
  rule: >-
    Each State law (law_index of the product's fixture IR) is assigned to exactly one conformance
    class by the subject its own statement constrains. core: the state model's identity, revision,
    lifecycle, idempotency and outcome semantics, tenant identity and schema binding, and the
    node's ownership boundary. capability: observable semantics of the declared state.* actions
    (receipts, problems, retry guidance, claims, fences, restore, erase, cursors, event order).
    runtime: persistence, transactions, the journal, restart and recovery, retention execution,
    TTL and budgets. adapter: every declared adapter boundary binding of the node, namely the
    Gate SDK inbound adapter (product topology adapters.inbound) and the storage-provider outbound
    adapter (the store provider binding). A law whose statement does not decide one class is
    recorded as unresolved in every profile and carried by none.
  ruling: >-
    CTO ruling for campaign L9-NODE-PIPELINE-01, lane O (2026-11-15). It settled the meaning of
    adapter (both boundaries above) and assigned the ten laws whose own text did not decide a
    class under the first draft of this rule: core AMBIGUITY-001, BIRTH-001, SCHEMA-001,
    TENANT-001; capability ERASE-001; runtime ATOMIC-001, JOURNAL-001, RECOVERY-001,
    RETENTION-002; adapter PROVIDER-001. No assigned law's own statement contradicts its class.
  witness: obligations[].law_ref in each authoritative-state profile
does_not_own:
  - global_constitutional_law
  - memory_release_admission
