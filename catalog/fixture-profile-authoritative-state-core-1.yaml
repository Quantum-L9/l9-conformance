obligations:
- id: O-AS-CORE-STATE-REV-001
  law_ref: STATE-REV-001
  statement: Revision starts at 0 and increments exactly once per state mutation; object identity is never
    reused.
  state_law_class: revision
  verification_class: fixture_replay
- id: O-AS-CORE-STATE-IDEMP-001
  law_ref: STATE-IDEMP-001
  statement: One scoped operation ID binds exactly one action and canonical request digest.
  state_law_class: idempotency
  verification_class: fixture_replay
- id: O-AS-CORE-STATE-OUTCOME-001
  law_ref: STATE-OUTCOME-001
  statement: An admitted OperationKey has at most one durable terminal receipt.
  state_law_class: idempotency
  verification_class: fixture_replay
- id: O-AS-CORE-STATE-OUTCOME-003
  law_ref: STATE-OUTCOME-003
  statement: A terminal OperationKey is never re-evaluated; changed-world retry requires a new operation_id.
  state_law_class: idempotency
  verification_class: fixture_replay
- id: O-AS-CORE-STATE-LIFECYCLE-001
  law_ref: STATE-LIFECYCLE-001
  statement: v1 lifecycle is active -> tombstoned -> active by retained restore; erased is terminal.
  state_law_class: lifecycle
  verification_class: fixture_replay
- id: O-AS-CORE-STATE-DOMAIN-001
  law_ref: STATE-DOMAIN-001
  statement: State core contains no domain-specific WorkItem/agent/business branches.
  state_law_class: authority
  verification_class: static_inspection
